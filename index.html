<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout · ShopKart</title>
  <style>
    :root {
      --background: #FFFFFF;
      --foreground: #24212A;
      --primary: #6312B7;
      --primary-foreground: #FFFFFF;
      --secondary: #F4F1F7;
      --tertiary: #17805B;
      --tertiary-foreground: #FFFFFF;
      --muted: #F7F5F9;
      --muted-foreground: #716A78;
      --accent: #EEE8F5;
      --accent-foreground: #3C2852;
      --card: #FFFFFF;
      --destructive: #C9334A;
      --border: #E7E1EA;
      --input: #DED6E3;
      --ring: #6312B7;
      --radius-lg: 0.875rem;
      --radius-xl: 0.75rem;
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / .1), 0 2px 4px -2px rgb(0 0 0 / .1);
      --font: Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body { font-family: var(--font); color: var(--foreground); background: var(--background); -webkit-font-smoothing: antialiased; line-height: 1.5; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    a { color: inherit; }
    h1, h2, h3, p, dl, dd, ol, ul { margin: 0; padding: 0; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    svg.icon { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .text-primary { color: var(--primary); }
    .text-destructive { color: var(--destructive); }

    /* ── Header ─────────────────────────── */
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    header.site { border-bottom: 1px solid var(--border); background: var(--background); }
    .hdr { max-width: 80rem; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 24px; }
    .logo { font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.025em; color: var(--foreground); text-decoration: none; }
    .logo span { color: var(--primary); }
    .nav { display: none; align-items: center; gap: 24px; font-size: 14px; font-weight: 500; color: var(--muted-foreground); }
    .nav a { text-decoration: none; }
    .search { margin-left: auto; display: none; flex: 1; max-width: 24rem; align-items: center; gap: 12px; border: 1px solid var(--input); background: var(--muted); border-radius: var(--radius-xl); padding: 8px 16px; font-size: 14px; color: var(--muted-foreground); }
    .search svg { font-size: 18px; }
    .hdr-end { margin-left: auto; display: flex; align-items: center; gap: 24px; }
    @media (min-width: 1024px) { .nav, .search { display: flex; } .hdr-end { margin-left: 0; } }
    .hdr-btn { position: relative; display: grid; place-items: center; min-width: 44px; min-height: 44px; background: none; border: 0; border-radius: var(--radius-lg); color: var(--foreground); font-size: 20px; }
    .hdr-btn.outline { border: 1px solid var(--border); }
    .badge { position: absolute; top: 0; right: 0; width: 20px; height: 20px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); font-size: 12px; line-height: 16px; font-weight: 700; display: grid; place-items: center; }
    body.is-confirmed .search, body.is-confirmed #cart-btn { display: none; }
    body.is-confirmed .hdr-end { margin-left: auto; }

    /* ── Page ───────────────────────────── */
    main.wrap { flex: 1; width: 100%; max-width: 80rem; margin: 0 auto; padding: 40px 24px; }
    @media (min-width: 1024px) { main.wrap { padding-top: 56px; padding-bottom: 56px; } }
    main.wrap.center { display: flex; align-items: center; justify-content: center; padding-top: 56px; padding-bottom: 56px; }
    .kicker { margin-bottom: 12px; font-size: 14px; font-weight: 600; color: var(--primary); }
    h1 { font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
    .lead { margin-top: 12px; font-size: 16px; color: var(--muted-foreground); }

    .steps { margin-top: 36px; max-width: 42rem; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; list-style: none; }
    .steps li { display: flex; align-items: center; gap: 12px; }
    .steps .dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--muted); color: var(--muted-foreground); }
    .steps li.current .dot { background: var(--primary); color: var(--primary-foreground); }
    .steps li.next .dot { background: var(--accent); color: var(--primary); }
    .steps .step-label { display: none; font-size: 14px; font-weight: 500; color: var(--muted-foreground); }
    .steps li.current .step-label { font-weight: 600; color: var(--foreground); }
    @media (min-width: 640px) { .steps .step-label { display: block; } }

    fieldset.layout { border: 0; padding: 0; margin: 40px 0 0; min-width: 0; display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 1024px) { fieldset.layout { grid-template-columns: minmax(0, 1.85fr) minmax(320px, 1fr); } }
    .block + .block { margin-top: 32px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h2 { font-size: 18px; line-height: 28px; font-weight: 600; }
    h3 { font-size: 16px; font-weight: 600; }
    .sub { margin-top: 4px; font-size: 14px; color: var(--muted-foreground); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); }
    .stack > * + * { margin-top: 16px; }

    .thumb { width: 112px; height: 112px; flex-shrink: 0; border-radius: var(--radius-lg); background: var(--muted); color: var(--primary); display: grid; place-items: center; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.sm { width: 64px; height: 64px; }

    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .product { padding: 16px; display: flex; gap: 16px; align-items: center; }
    .product .price { margin: 4px 0 10px; font-weight: 700; color: var(--primary); }
    .btn-outline { min-height: 40px; padding: 0 14px; border-radius: var(--radius-lg); border: 1px solid var(--primary); background: #fff; color: var(--primary); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

    .btn-outline:disabled, .link-danger:disabled { opacity: .5; }

    .item { padding: 16px; display: flex; gap: 16px; }
    .item-body { flex: 1; min-width: 0; }
    .item-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .item-row { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .icon-btn { min-width: 44px; min-height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--muted-foreground); border-radius: var(--radius-lg); font-size: 18px; }
    .icon-btn:hover:not(:disabled) { background: var(--muted); }
    .icon-btn:disabled { opacity: .35; }
    .qty { display: flex; align-items: center; border: 1px solid var(--input); border-radius: var(--radius-lg); background: var(--background); }
    .qty .icon-btn { color: var(--foreground); font-size: 16px; }
    .qty output { width: 32px; text-align: center; font-weight: 600; font-size: 14px; }
    .line-label { font-size: 14px; color: var(--muted-foreground); text-align: right; }
    .line-total { font-size: 18px; line-height: 28px; font-weight: 700; color: var(--primary); text-align: right; }
    .link-danger { border: 0; background: none; color: var(--destructive); font-weight: 600; font-size: 14px; min-height: 44px; }

    .empty { padding: 32px; text-align: center; }
    @media (min-width: 640px) { .empty { padding: 48px; } }
    .empty .thumb { margin: 0 auto; width: 192px; height: 192px; border-radius: var(--radius-xl); }
    .empty .kicker { margin: 32px 0 0; }
    .empty h2 { margin-top: 12px; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.025em; }
    .empty .copy { margin: 12px auto 0; max-width: 28rem; font-size: 16px; line-height: 28px; color: var(--muted-foreground); text-wrap: pretty; }
    .empty .foot { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }

    .details { padding: 24px; }
    .details-head { display: flex; gap: 12px; align-items: flex-start; }
    .chip { width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--accent); color: var(--primary); display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
    label.field { display: block; margin-top: 24px; font-size: 14px; font-weight: 600; }
    input[type=text] { margin-top: 8px; width: 100%; min-height: 48px; padding: 0 16px; border: 1px solid var(--input); border-radius: var(--radius-lg); font: inherit; font-size: 14px; color: var(--foreground); background: var(--background); outline: none; }
    input[type=text]:focus { box-shadow: 0 0 0 2px var(--ring); }
    input[aria-invalid=true] { border-color: var(--destructive); }
    input[aria-invalid=true]:focus { box-shadow: 0 0 0 2px var(--destructive); }
    .hint { margin-top: 8px; font-size: 12px; color: var(--muted-foreground); }
    .field-error { margin-top: 8px; font-size: 14px; color: var(--destructive); display: flex; gap: 8px; align-items: center; }
    .field-error svg { font-size: 16px; }
    .alert { margin-top: 20px; padding: 16px; border: 1px solid var(--destructive); background: var(--muted); border-radius: var(--radius-lg); display: flex; gap: 12px; }
    .alert svg { color: var(--destructive); margin-top: 2px; font-size: 20px; }
    .alert p { font-size: 14px; }
    .alert .title { font-weight: 600; }
    .alert .text { margin-top: 4px; color: var(--muted-foreground); }

    aside .summary { padding: 24px; }
    @media (min-width: 1024px) { aside { position: sticky; top: 24px; align-self: start; } }
    .rows { margin-top: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .rows div { display: flex; justify-content: space-between; gap: 12px; }
    .rows div + div { margin-top: 16px; }
    .rows .k { color: var(--muted-foreground); }
    .rows .v { font-weight: 500; }
    .free { color: var(--tertiary); font-weight: 500; }
    .grand { margin-top: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
    .grand .k { font-weight: 600; }
    .grand .v { font-size: 30px; line-height: 36px; font-weight: 700; color: var(--primary); }
    .btn-primary { margin-top: 24px; width: 100%; min-height: 48px; padding: 0 20px; border: 0; border-radius: var(--radius-lg); background: var(--primary); color: var(--primary-foreground); font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-md); }
    .btn-primary svg { font-size: 18px; }
    .btn-primary:disabled { opacity: .7; }
    .secure { margin-top: 20px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted-foreground); }
    .secure svg { font-size: 16px; color: var(--tertiary); }
    .trust { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 12px; color: var(--muted-foreground); }
    .trust svg { font-size: 18px; color: var(--primary); }
    .trust p { margin-top: 4px; }

    /* ── Confirmation ───────────────────── */
    .confirm { width: 100%; max-width: 42rem; padding: 32px; text-align: center; }
    @media (min-width: 640px) { .confirm { padding: 48px; } }
    .check { width: 80px; height: 80px; margin: 0 auto; border-radius: 50%; background: var(--tertiary); color: var(--tertiary-foreground); display: grid; place-items: center; font-size: 36px; box-shadow: var(--shadow-md); }
    .confirm .ok { margin-top: 28px; font-size: 14px; font-weight: 600; color: var(--tertiary); }
    .confirm h1 { margin-top: 12px; }
    .confirm .copy { margin: 12px auto 0; max-width: 28rem; font-size: 16px; line-height: 28px; color: var(--muted-foreground); text-wrap: pretty; }
    .facts { margin-top: 36px; padding: 20px; border-radius: var(--radius-xl); background: var(--muted); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; text-align: left; }
    @media (min-width: 640px) { .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .facts dt { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.025em; color: var(--muted-foreground); }
    .facts dd { margin-top: 8px; font-size: 14px; font-weight: 700; }
    .facts dd.total { font-size: 18px; color: var(--primary); }
    .facts dd.when { font-weight: 600; }
    .notice { margin-top: 28px; padding: 16px 20px; border: 1px solid var(--border); border-radius: var(--radius-lg); text-align: left; display: flex; gap: 12px; }
    .notice svg { margin-top: 2px; font-size: 20px; color: var(--primary); }
    .notice p { font-size: 14px; }
    .notice .title { font-weight: 600; }
    .notice .text { margin-top: 4px; color: var(--muted-foreground); }
    .btn-inline { margin-top: 32px; display: inline-flex; width: auto; padding: 0 24px; }
    .support { margin-top: 24px; font-size: 12px; color: var(--muted-foreground); }
    .support a { font-weight: 600; color: var(--primary); text-decoration: none; }

    footer.site-foot { border-top: 1px solid var(--border); background: var(--muted); }
    footer.site-foot .wrap { max-width: 80rem; margin: 0 auto; padding: 20px 24px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted-foreground); }
    footer.site-foot a { font-weight: 600; color: var(--primary); text-decoration: none; }
    @media (min-width: 640px) { footer.site-foot .wrap { flex-direction: row; } }

    @media (prefers-reduced-motion: no-preference) {
      .confirm { animation: rise .35s ease-out; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>

<div class="page">
  <header class="site">
    <div class="hdr">
      <a class="logo" href="./">Shop<span>Kart</span></a>
      <nav class="nav" aria-label="Main"><a href="#">Shop</a><a href="#">Deals</a><a href="#">Categories</a></nav>
      <div class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span>Search for essentials</span></div>
      <div class="hdr-end">
        <button class="hdr-btn" type="button" id="cart-btn" aria-label="Cart, 0 items">
          <svg class="icon"><use href="#i-cart"/></svg>
          <span class="badge" id="cart-badge" hidden>0</span>
        </button>
        <button class="hdr-btn outline" type="button" aria-label="Profile"><svg class="icon"><use href="#i-user"/></svg></button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main"></main>

  <footer class="site-foot"><div class="wrap" id="foot"></div></footer>

<script>
(() => {
  'use strict';

  };

  // Synthetic products with fixed prices, in whole rupees.
  const PRODUCTS = [
    { id: 'headphones', name: 'Wireless Headphones', blurb: 'Studio comfort · Active noise cancellation', price: 1999, img: IMAGES.headphones, alt: 'Matte black wireless over-ear headphones' },
    { id: 'watch',      name: 'Smart Watch',         blurb: 'Graphite case · Health &amp; fitness tracking', price: 2499, img: IMAGES.watch, alt: 'Graphite smartwatch with black strap' },
  ];
  const MAX_QTY = 10;

  const state = {
    cart: {},            // productId -> quantity
    name: '',
    errors: { cart: false, name: false },
    status: 'editing',   // 'editing' | 'placing' | 'placed'
    order: null,
  };

  const main = document.getElementById('main');
  const inr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
  const money = (n) => inr.format(n);
  const cartLines = () => PRODUCTS.filter((p) => state.cart[p.id] > 0).map((p) => ({ ...p, qty: state.cart[p.id], total: p.price * state.cart[p.id] }));
  const itemCount = () => cartLines().reduce((n, l) => n + l.qty, 0);
  const orderTotal = () => cartLines().reduce((n, l) => n + l.total, 0);
  const icon = (id) => `<svg class="icon" aria-hidden="true"><use href="#${id}"/></svg>`;
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const firstName = (s) => s.trim().split(/\s+/)[0];

  function makeReference() {
    return `SK-${new Date().getFullYear()}-${Math.floor(10000 + Math.random() * 90000)}`;
  }

  // Delivery estimate: 3 to 5 days from today, e.g. "27–29 Nov".
  function deliveryWindow() {
    const from = new Date(); from.setDate(from.getDate() + 3);
    const to = new Date();   to.setDate(to.getDate() + 5);
    const mon = (d) => d.toLocaleString('en-GB', { month: 'short' });
    return from.getMonth() === to.getMonth()
      ? `${from.getDate()}–${to.getDate()} ${mon(to)}`
      : `${from.getDate()} ${mon(from)}–${to.getDate()} ${mon(to)}`;
  }

  // ---------- actions ----------
  function addItem(id) {
    state.cart[id] = Math.min((state.cart[id] || 0) + 1, MAX_QTY);
    state.errors.cart = false;
    render({ focus: `[data-qty="${id}"]` });
  }
  function changeQty(id, delta) {
    const next = (state.cart[id] || 0) + delta;
    if (next < 1 || next > MAX_QTY) return;
    state.cart[id] = next;
    render({ focus: `[data-action="${delta > 0 ? 'inc' : 'dec'}"][data-id="${id}"]` });
  }
  function removeItem(id) {
    delete state.cart[id];
    render({ focus: '#products-heading' });
  }
  function clearCart() {
    state.cart = {};
    render({ focus: '#products-heading' });
  }

  function placeOrder() {
    // Guard: only one order per checkout, however many times the button fires.
    if (state.status !== 'editing') return;

    state.errors.cart = itemCount() === 0;
    state.errors.name = state.name.trim() === '';
    if (state.errors.cart || state.errors.name) {
      render({ focus: state.errors.name ? '#full-name' : '#products-heading' });
      return;
    }

    state.status = 'placing';
    state.order = {
      reference: makeReference(),
      name: state.name.trim(),
      lines: cartLines(),
      total: orderTotal(),
      items: itemCount(),
      delivery: deliveryWindow(),
    };
    render();
    // Simulated processing delay (no backend). Makes the double-click window real.
    setTimeout(() => {
      state.status = 'placed';
      render({ focus: '#confirm-heading' });
    }, 600);
  }

  function startNewOrder() {
    state.cart = {};
    state.name = '';
    state.errors = { cart: false, name: false };
    state.status = 'editing';
    state.order = null;
    render({ focus: 'h1' });
  }

  // ---------- views ----------
  function stepsView() {
    const labels = ['Cart', 'Details', 'Confirmation'];
    const cls = ['current', 'next', ''];
    return `<ol class="steps" aria-label="Checkout progress">${labels.map((l, i) =>
      `<li class="${cls[i]}"${i === 0 ? ' aria-current="step"' : ''}><span class="dot">${i + 1}</span><span class="step-label">${l}</span></li>`).join('')}</ol>`;
  }

  function productsView() {
    return `
      <section class="block" aria-labelledby="products-heading">
        <div class="section-head"><div>
          <h2 id="products-heading" tabindex="-1">Products</h2>
          <p class="sub">Fixed prices, free shipping.</p>
        </div></div>
        <div class="products">
          ${PRODUCTS.map((p) => `
            <article class="card product">
              <div class="thumb sm"><img src="${p.img}" alt="${p.alt}" width="64" height="64"></div>
              <div>
                <h3>${p.name}</h3>
                <p class="price">${money(p.price)}</p>
                <button type="button" class="btn-outline" data-action="add" data-id="${p.id}" aria-label="Add ${p.name} to cart"
                  ${(state.cart[p.id] || 0) >= MAX_QTY ? 'disabled' : ''}>${icon('i-plus')} Add to cart</button>
              </div>
            </article>`).join('')}
        </div>
      </section>`;
  }

  function cartView() {
    const lines = cartLines();
    const count = itemCount();
    if (!lines.length) {
      return `
        <section class="block" aria-labelledby="cart-heading">
          <h2 id="cart-heading" class="sr-only">Shopping cart</h2>
          <div class="card empty" data-testid="empty-cart">
            <div class="thumb"><img src="${IMAGES.empty}" alt="Lavender shopping bag and parcel representing an empty cart" width="192" height="192"></div>
            <p class="kicker">A fresh start awaits</p>
            <h2>Your cart is empty.</h2>
            <p class="copy">Explore beautifully chosen essentials and add something special when you’re ready.</p>
            <button type="button" class="btn-primary btn-inline" data-action="shop">Continue Shopping ${icon('i-arrow')}</button>
            <p class="foot">Secure checkout · Curated essentials · Easy returns</p>
          </div>
        </section>`;
    }
    return `
      <section class="block" aria-labelledby="cart-heading">
        <div class="section-head">
          <div>
            <h2 id="cart-heading">Shopping cart</h2>
            <p class="sub" data-testid="cart-count">${count} carefully selected ${count === 1 ? 'item' : 'items'}</p>
          </div>
          <button type="button" class="link-danger" data-action="clear">Clear cart</button>
        </div>
        <ul class="stack" style="list-style:none;margin:0;padding:0">
          ${lines.map((l) => `
            <li class="card item" data-testid="line-${l.id}">
              <div class="thumb"><img src="${l.img}" alt="${l.alt}" width="112" height="112"></div>
              <div class="item-body">
                <div class="item-top">
                  <div><h3>${l.name}</h3><p class="sub">${l.blurb}</p></div>
                  <button type="button" class="icon-btn" data-action="remove" data-id="${l.id}" aria-label="Remove ${l.name}">${icon('i-trash')}</button>
                </div>
                <div class="item-row">
                  <div class="qty" role="group" aria-label="Quantity for ${l.name}">
                    <button type="button" class="icon-btn" data-action="dec" data-id="${l.id}" aria-label="Decrease quantity of ${l.name}" ${l.qty <= 1 ? 'disabled' : ''}>${icon('i-minus')}</button>
                    <output data-qty="${l.id}" tabindex="-1" aria-live="polite" aria-label="Quantity of ${l.name}">${l.qty}</output>
                    <button type="button" class="icon-btn" data-action="inc" data-id="${l.id}" aria-label="Increase quantity of ${l.name}" ${l.qty >= MAX_QTY ? 'disabled' : ''}>${icon('i-plus')}</button>
                  </div>
                  <div><p class="line-label">Line total</p><p class="line-total" data-testid="line-total-${l.id}">${money(l.total)}</p></div>
                </div>
              </div>
            </li>`).join('')}
        </ul>
      </section>`;
  }

  function detailsView() {
    const err = state.errors.name;
    return `
      <section class="block card details" aria-labelledby="details-heading">
        <div class="details-head">
          <span class="chip">${icon('i-user')}</span>
          <div><h2 id="details-heading">Customer details</h2><p class="sub">We’ll use this to personalize your order confirmation.</p></div>
        </div>
        ${err ? `
          <div class="alert" role="alert">
            ${icon('i-alert')}
            <div><p class="title">A quick check before you continue</p><p class="text">Please share the name to use on your order confirmation.</p></div>
          </div>` : ''}
        <label class="field" for="full-name">Full name <span class="text-destructive" aria-hidden="true">*</span></label>
        <input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="Enter your full name" maxlength="80"
          required aria-required="true" ${err ? 'aria-invalid="true" aria-describedby="name-error"' : 'aria-describedby="name-hint"'}
          value="${esc(state.name)}" />
        ${err
          ? `<p class="field-error" id="name-error">${icon('i-alert')}Please enter your full name.</p>`
          : `<p class="hint" id="name-hint">Required to place your order.</p>`}
      </section>`;
  }

  function summaryView() {
    const placing = state.status === 'placing';
    return `
      <aside>
        <section class="card summary" aria-labelledby="summary-heading">
          <h2 id="summary-heading">Order summary</h2>
          <div class="rows">
            <div><span class="k">Subtotal</span><span class="v" data-testid="subtotal">${money(orderTotal())}</span></div>
            <div><span class="k">Shipping</span><span class="free">Free</span></div>
          </div>
          <div class="grand"><span class="k">Grand total</span><span class="v" data-testid="order-total">${money(orderTotal())}</span></div>
          ${state.errors.cart ? `
            <div class="alert" role="alert" data-testid="cart-error">
              ${icon('i-alert')}
              <div><p class="title">Your cart is empty</p><p class="text">Add at least one item to place an order.</p></div>
            </div>` : ''}
          <button type="submit" class="btn-primary" id="place-order" ${placing ? 'disabled aria-busy="true"' : ''}>
            ${placing ? 'Placing order…' : `Place Order ${icon('i-arrow')}`}
          </button>
          <p class="secure">${icon('i-lock')}<span>Your payment details are encrypted and secure.</span></p>
          <div class="trust">
            <div>${icon('i-shield')}<p>Protected</p></div>
            <div>${icon('i-refresh')}<p>Easy returns</p></div>
            <div>${icon('i-circle-check')}<p>Authentic</p></div>
          </div>
        </section>
      </aside>`;
  }

  function checkoutView() {
    return `
      <p class="kicker">Secure checkout</p>
      <h1 tabindex="-1">Checkout</h1>
      <p class="lead">Complete your order in a few simple steps.</p>
      ${stepsView()}
      <form id="checkout-form" novalidate>
        <fieldset class="layout" ${state.status === 'placing' ? 'disabled' : ''}>
          <legend class="sr-only">Checkout</legend>
          <div>${productsView()}${cartView()}${detailsView()}</div>
          ${summaryView()}
        </fieldset>
      </form>`;
  }

  function confirmView() {
    const o = state.order;
    return `
      <section class="card confirm" data-testid="confirmation" aria-labelledby="confirm-heading">
        <div class="check">${icon('i-check')}</div>
        <p class="ok">Payment received securely</p>
        <h1 id="confirm-heading" tabindex="-1">Order Confirmed!</h1>
        <p class="copy">Thank you, <span data-testid="confirm-name">${esc(firstName(o.name))}</span>. Your selected essentials are being prepared with care.</p>
        <dl class="facts">
          <div><dt>Order reference</dt><dd data-testid="order-reference">${o.reference}</dd></div>
          <div><dt>Order total</dt><dd class="total" data-testid="confirm-total">${money(o.total)}</dd></div>
          <div><dt>Estimated delivery</dt><dd class="when" data-testid="confirm-delivery">${o.delivery}</dd></div>
        </dl>
        <div class="notice">
          ${icon('i-mail')}
          <div><p class="title">Confirmation sent</p><p class="text">A receipt and delivery updates will be sent to your email.</p></div>
        </div>
        <button type="button" class="btn-primary btn-inline" data-action="new-order">Continue Shopping ${icon('i-arrow')}</button>
        <p class="support">Need help with this order? <a href="#">Contact ShopKart support</a></p>
      </section>`;
  }

  // ---------- render ----------
  function render(opts = {}) {
    const placed = state.status === 'placed';
    document.body.classList.toggle('is-confirmed', placed);
    main.className = placed ? 'wrap center' : 'wrap';
    main.innerHTML = placed ? confirmView() : checkoutView();
    document.getElementById('foot').innerHTML = placed
      ? '<span>© 2026 ShopKart</span><span>Thoughtfully selected, securely delivered.</span>'
      : '<span>© 2026 ShopKart. Thoughtfully selected, securely delivered.</span><span>Need help? <a href="#">Contact support</a></span>';
    const n = placed ? 0 : itemCount();
    const badge = document.getElementById('cart-badge');
    badge.textContent = String(n);
    badge.hidden = n === 0;
    document.getElementById('cart-btn').setAttribute('aria-label', `Cart, ${n} ${n === 1 ? 'item' : 'items'}`);
    if (opts.focus) {
      const el = main.querySelector(opts.focus);
      if (el) el.focus({ preventScroll: opts.focus !== '#full-name' && opts.focus !== '#confirm-heading' });
    }
  }

  // ---------- events (delegated, survive re-render) ----------
  main.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn || btn.disabled) return;
    // Cart and name are locked while an order is being placed (fixes DEF-1).
    if (state.status === 'placing' && btn.dataset.action !== 'new-order') return;
    const { action, id } = btn.dataset;
    if (action === 'add') addItem(id);
    else if (action === 'inc') changeQty(id, +1);
    else if (action === 'dec') changeQty(id, -1);
    else if (action === 'remove') removeItem(id);
    else if (action === 'clear') clearCart();
    else if (action === 'new-order') startNewOrder();
    else if (action === 'shop') {
      const h = document.getElementById('products-heading');
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      h.focus({ preventScroll: true });
    }
  });

  main.addEventListener('input', (e) => {
    if (e.target.id !== 'full-name' || state.status !== 'editing') return;
    state.name = e.target.value;
    // Clear the name error as soon as the customer types something.
    if (state.errors.name && state.name.trim() !== '') {
      state.errors.name = false;
      const caret = e.target.selectionStart;
      render({ focus: '#full-name' });
      const input = document.getElementById('full-name');
      input.setSelectionRange(caret, caret);
    }
  });

  // Covers both the button click and pressing Enter in the name field.
  main.addEventListener('submit', (e) => {
    e.preventDefault();
    placeOrder();
  });

  document.getElementById('cart-btn').addEventListener('click', () => {
    const target = document.getElementById('cart-heading');
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  render();
})();
</script>
</body>
</html>
